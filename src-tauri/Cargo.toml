[package]
name = "todolite"
version = "1.0.0"
description = "A beautiful, secure, local-first To-Do planner for Windows"
authors = ["CodeByteVector"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "todolite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.1", features = ["array", "bundled-sqlcipher"] }
tauri-plugin-notification = "2.3.3"
tauri-plugin-autostart = "2.5.1"
tokio = { version = "1.53.1", features = ["time", "rt-multi-thread", "macros"] }
windows-sys = { version = "0.61.2", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_System_Memory", "Win32_Security"] }
chrono = { version = "0.4.45", features = ["clock"] }
aes-gcm = "0.11.1"
scrypt = "0.11.0"
rand = "0.8.5"
zeroize = "1.8.1"

[dev-dependencies]
tempfile = "3.20.0"

